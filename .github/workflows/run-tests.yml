name: Run tests

# Триггер
on:
  push:
    paths:
      - 'src/**'
  workflow_dispatch:

jobs: # Этапы работы пайплайна
  run-tests:
    name: Set up services (review apps) and run tests
    runs-on: ubuntu-latest
    steps: # Шаги внутри job
      - name: Checkout repository # Копирование файлов репозитория внутрь CI агента
        uses: actions/checkout@v4

      - name: Set up JDK # Установка JDK для работы с проектом
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Cache Maven repository # Кэширование репозитория Maven для ускорения сборки
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up QEMU (for arm64 docker images)
        uses: docker/setup-qemu-action@v3

      - name: Make mvnw executable # Даем права на запуск wrapper
        run: chmod +x mvnw

      - name: Build
        run: ./mvnw clean compile

      - name: Verify
        run: ./mvnw verify -DskipTests

      - name: Set up services # Настройка сервисов, например, запуск Docker контейнеров
        run: cd infra/docker_compose && pwd && bash run-tests-with-docker-compose.sh && cd ../..

      - name: Run tests # Запуск тестов с Maven
        env: # Теперь env стоит правильно — на одном уровне с run
          APIBASEURL: http://localhost:4111
          UIBASEURL: http://frontend:80
        run: |
          echo "Waiting for backend to be ready..."
          # Цикл будет каждые 5 секунд проверять, отвечает ли порт 4111
          timeout 180s bash -c '
          until curl -s http://localhost:4111 > /dev/null; do
          echo "Backend is still starting... waiting"
          sleep 5
          done
          '
          echo "Backend is UP! Running tests..."
          ./mvnw clean test -q

      - name: Dump Docker logs on failure
        if: always() # Этот шаг теперь гарантированно запустится, так как он отдельный
        run: |
          echo "=== All active docker containers ==="
          docker ps -a
          echo "=== Attempting to print logs ==="
          # Выведем логи всех контейнеров, чтобы понять, как он точно называется на агенте
          docker ps --format "{{.Names}}" | xargs -I {} sh -c 'echo "Logs for {} :"; docker logs --tail 50 {}; echo "-------------------"'

      - name: Run Swagger coverage
        if: always()
        run: |
          # Выдаем права на исполнение CLI утилите
          chmod +x ./swagger-coverage/swagger-coverage-commandline-1.4.3/bin/swagger-coverage-commandline
          # Запускаем генерацию покрытия
          ./swagger-coverage/swagger-coverage-commandline-1.4.3/bin/swagger-coverage-commandline -s swagger.json -i swagger-coverage-output

      - name: Check API Coverage Quality Gate
        if: always()
        run: |
            echo "=== Checking API Coverage Quality Gate (Operations) ==="
            
            JSON_FILE="swagger-coverage-results.json"
            if [ ! -f "$JSON_FILE" ]; then
              JSON_FILE=$(find . -name "swagger-coverage-results.json" | head -n 1)
            fi
            
            if [ -z "$JSON_FILE" ] || [ ! -f "$JSON_FILE" ]; then
              echo "❌ ERROR: swagger-coverage-results.json not found! Cannot check quality gate."
              exit 1
            fi
            
            echo "Found results file at: $JSON_FILE"
            
            # 1. Считаем общее количество ручек API (Operations)
            TOTAL_OPERATIONS=$(jq '.operations | length' "$JSON_FILE")
            
            # 2. Считаем количество покрытых ручек (все, у которых статус НЕ равен "EMPTY")
            COVERED_OPERATIONS=$(jq '[.operations[] | select(.state == "FULL")] | length' "$JSON_FILE")            
            echo "Total API Operations expected: $TOTAL_OPERATIONS"
            echo "Covered API Operations: $COVERED_OPERATIONS"
            
            if [ "$TOTAL_OPERATIONS" -eq 0 ]; then
              echo "❌ ERROR: Total operations count is 0. Check your swagger.json"
              exit 1
            fi
            
            # 3. Вычисляем процент покрытия ручек
            COVERAGE_INT=$(( COVERED_OPERATIONS * 100 / TOTAL_OPERATIONS ))
            echo "Current API Operations Coverage is: $COVERAGE_INT%"
            
            # 4. Проверяем условие лида (падает, если меньше 50%)
            if [ "$COVERAGE_INT" -lt 50 ]; then
              echo "❌ QUALITY GATE FAILED: API Operations Coverage ($COVERAGE_INT%) is below the required 50%!"
              exit 1
            else
              echo "✅ QUALITY GATE PASSED: API Operations Coverage ($COVERAGE_INT%) is sufficient."
            fi

      - name: Load test report history
        uses: actions/checkout@v4
        if: always()
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build test report
        uses: simple-elf/allure-report-action@v1.13
        if: always()
        with:
          gh_pages: gh-pages
          allure_results: target/allure-results
          allure_history: allure-history

      - name: Build Swagger coverage report
        if: always()
        run: |
          # Создаем отдельную подпапку под Swagger внутри папки текущего билда, которую создал Allure
          sudo mkdir -p allure-history/${{ github.run_number }}/swagger-coverage
          # Копируем отчет туда под именем index.html, чтобы он корректно открывался по ссылке
          sudo cp swagger-coverage-report.html allure-history/${{ github.run_number }}/swagger-coverage/index.html

      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Log in to Docker Hub #После успешных проверок Логин в докерхаб
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image #Собираем образ нашего проекта
        run: docker build -t 9708/nbank-tests:${{ github.sha }} .

      - name: Push Docker image to Docker Hub #Пушим образ
        run: docker push 9708/nbank-tests:${{ github.sha }}

      - name: Clean up servises
        if: always()
        run: cd infra/docker_compose && docker compose down