name: Run tests

# Триггер
on:
  push:
    paths:
      - 'src/**'
  workflow_dispatch:

jobs: # Этапы работы пайплайна
  run-tests:
    name: Set up services (review apps) and run tests
    runs-on: ubuntu-latest
    steps: # Шаги внутри job
      - name: Checkout repository # Копирование файлов репозитория внутрь CI агента
        uses: actions/checkout@v4

      - name: Set up JDK # Установка JDK для работы с проектом
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Cache Maven repository # Кэширование репозитория Maven для ускорения сборки
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up QEMU (for arm64 docker images)
        uses: docker/setup-qemu-action@v3

      - name: Make mvnw executable # Даем права на запуск wrapper
        run: chmod +x mvnw

      - name: Build
        run: ./mvnw clean compile

      - name: Verify
        run: ./mvnw verify -DskipTests

      - name: Set up services # Настройка сервисов, например, запуск Docker контейнеров
        run: cd infra/docker_compose && pwd && bash run-tests-with-docker-compose.sh && cd ../..

#      - name: Run tests # Запуск тестов с Maven
#        env: # Теперь env стоит правильно — на одном уровне с run
#          APIBASEURL: http://localhost:4111
#          UIBASEURL: http://frontend:80
#        run: |
#            echo "Waiting for backend to be ready..."
#            # Цикл будет каждые 5 секунд проверять, отвечает ли порт 4111
#            timeout 180s bash -c '
#              until curl -s http://localhost:4111 > /dev/null; do
#                echo "Backend is still starting... waiting"
#                sleep 5
#              done
#            '
#            echo "Backend is UP! Running tests..."
#            ./mvnw clean test -q

      - name: Dump Docker logs on failure
        if: always() # Этот шаг теперь гарантированно запустится, так как он отдельный
        run: |
          echo "=== All active docker containers ==="
          docker ps -a
          echo "=== Attempting to print logs ==="
          # Выведем логи всех контейнеров, чтобы понять, как он точно называется на агенте
          docker ps --format "{{.Names}}" | xargs -I {} sh -c 'echo "Logs for {} :"; docker logs --tail 50 {}; echo "-------------------"'

      - name: Run Swagger coverage
        if: always()
        run: |
          # Выдаем права на исполнение CLI утилите
          chmod +x ./swagger-coverage/swagger-coverage-commandline-1.4.3/bin/swagger-coverage-commandline
          
          # Запускаем генерацию покрытия
          ./swagger-coverage/swagger-coverage-commandline-1.4.3/bin/swagger-coverage-commandline -s swagger.json -i swagger-coverage-output

      # 1. Скачиваем текущий сайт из ветки gh-pages, чтобы не стереть прошлые билды (19, 20 и т.д.)
      - name: Load test report history
        uses: actions/checkout@v4
        if: always()
        with:
          ref: gh-pages
          path: old-gh-pages

      # 2. Скачиваем официальную утилиту Allure CLI (она сгенерирует чистый HTML без магии экшенов)
      - name: Install Allure CLI
        if: always()
        run: |
          sudo wget https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
          sudo tar -zxvf allure-2.24.0.tgz -C /opt/
          sudo ln -s /opt/allure-2.24.0/bin/allure /usr/bin/allure

      # 3. Сами собираем структуру строго по ТЗ руководителя
      - name: Build target folders structure
        if: always()
        run: |
          # Создаем физические папки под текущий номер пайплайна
          mkdir -p test-report/${{ github.run_number }}/allure-report
          mkdir -p test-report/${{ github.run_number }}/swagger-coverage
          
          # Подтягиваем историю прошлых запусков для Allure (чтобы графики трендов внутри Алюра работали)
          PREV_BUILD=$(( ${{ github.run_number }} - 1 ))
          if [ -d "old-gh-pages/test-report/${PREV_BUILD}/allure-report/history" ]; then
            cp -r old-gh-pages/test-report/${PREV_BUILD}/allure-report/history target/allure-results/history
          fi
          
          # Генерируем Allure прямо в папку по ТЗ
          allure generate target/allure-results -o test-report/${{ github.run_number }}/allure-report --clean
          
          # Копируем Swagger-отчет и переименовываем его в index.html
          if [ -f "swagger-coverage-report.html" ]; then
            cp swagger-coverage-report.html test-report/${{ github.run_number }}/swagger-coverage/index.html
          fi
          
          # Бережно переносим ВСЕ старые билды из старого gh-pages в нашу новую папку, чтобы они не пропали с сайта
          if [ -d "old-gh-pages/test-report" ]; then
            rsync -a old-gh-pages/test-report/ test-report/
          fi
          
          # Делаем редирект для корня сайта, чтобы главная страница не отдавала 404, 
          # а перекидывала на самый свежий Allure-отчет
          cat <<EOF > index.html
          <!DOCTYPE html>
          <html>
            <head>
              <meta http-equiv="refresh" content="0; url=./test-report/${{ github.run_number }}/allure-report/" />
              <script type="text/javascript">
                window.location.href = "./test-report/${{ github.run_number }}/allure-report/"
              </script>
            </head>
            <body>
              Redirecting to latest report...
            </body>
          </html>
          EOF

      # 4. Публикуем всю нашу папку test-report и коренной редирект на GitHub Pages
      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          # Важно: деплоим текущую рабочую директорию, куда мы все красиво разложили
          publish_dir: .

      - name: Log in to Docker Hub #После успешных проверок Логин в докерхаб
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image #Собираем образ нашего проекта
        run: docker build -t 9708/nbank-tests:${{ github.sha }} .

      - name: Push Docker image to Docker Hub #Пушим образ
        run: docker push 9708/nbank-tests:${{ github.sha }}

      - name: Clean up servises
        if: always()
        run: cd infra/docker_compose && docker compose down

